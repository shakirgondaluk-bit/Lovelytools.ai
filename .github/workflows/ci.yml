name: CI

# The backbone check. The local pre-commit hook in .githooks is fast feedback and
# is bypassable with --no-verify; this is the copy that always runs.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # corepack, not a pinned action input, so the pnpm version comes from
      # package.json's "packageManager" field (11.15.1) and there is one place
      # to change it. The repo needs 10+ for pnpm-workspace.yaml's allowBuilds.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      # The install is the slow part: @lovelytools/wasm-build's postinstall
      # stages ~160 MB of engine assets. It only copies out of node_modules —
      # nothing is downloaded from a CDN — so a warm store makes it cheap.
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Three different nets: lint catches wrong-way-to-do-it, typecheck catches
      # wrong-shape, test catches wrong-behaviour. Each runs even if an earlier
      # one failed, so one push reports every problem rather than the first.
      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Test
        if: '!cancelled()'
        run: pnpm test

      # Last because it is the slowest, and because the three above localise a
      # failure better than a build error does.
      - name: Build
        if: '!cancelled()'
        run: pnpm build
