packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/engines/*'
  - 'tooling/*'

# pnpm 10+ blocks dependency postinstall scripts by default (supply-chain
# hardening) and only reads the allow-list from this field — package.json's
# "pnpm" key and this file's old "onlyBuiltDependencies" list are both
# deprecated and silently ignored by pnpm 11.
#
# esbuild/onnxruntime-node/sharp/protobufjs are transitive, pulled in only
# because @huggingface/transformers optionally supports Node-side backends
# this app never uses — they're aliased to `false` for the browser bundle in
# next.config.ts, and `next build` (apps/web's only build script) uses SWC,
# not esbuild, so none of their native postinstalls are on the critical path.
# On Hostinger's Cloud Startup plan esbuild's own binary-verification
# postinstall fails outright (sandboxed exec), so these are left unbuilt
# rather than forced. tesseract.js's postinstall is just an OpenCollective
# funding message — harmless, allowed.
#
# unrs-resolver is the native module resolver behind eslint-plugin-import-x,
# which eslint-config-next pulls in. Its postinstall only compiles a fallback
# binary when no prebuilt one matches the platform; napi ships one for
# win32-x64 and linux-x64, so the script is dead weight here and is left
# unbuilt for the same sandboxed-exec reason as esbuild. It is a lint-only
# devDependency and never reaches a production build. If linting ever fails to
# resolve imports on a new platform, flip this to true.
allowBuilds:
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tesseract.js: true
  unrs-resolver: false

# Transitive security patches. Same story as allowBuilds above: pnpm 11 reads
# overrides from this file only — package.json's "pnpm.overrides" is silently
# ignored, which is easy to miss because the install still exits 0.
#
# brace-expansion reaches us as js-beautify > editorconfig/glob > minimatch >
# brace-expansion@2.1.2, which is vulnerable to GHSA-mh99-v99m-4gvg
# (CVE-2026-14257, unbounded expansion -> OOM crash) and GHSA-rgw5-rvv9-x895
# (the bypass of that fix, unbounded intermediate arrays). minimatch has no
# release pinning a fixed 2.x, so the floor is set here. Scoped to the 2.x
# major on purpose: the 1.1.18 and 5.0.9 copies elsewhere in the tree are
# already on patched releases, and their dependents expect those majors.
overrides:
  brace-expansion@2: ^2.1.4
